{% extends "website_index/base.html" %}

{% block content %}
  <p>只有经过管理员审核的账户才能登录。</p>
  <form method="POST" action="{% url 'users:login' %}">
    {% csrf_token %}
    {{ form.as_p }}

    <button name="submit">登录</button>
    <input type="hidden" name="next"
      value="{% url 'website_index:index' %}" />
  </form>

{% endblock content %}
