{% extends 'website_index/base.html' %}

{% block page_title %}上传作品 - {{ series.name }}{% endblock page_title %}

{% block content %}
  <div class="page-shell">
    <div class="form-layout">
      <header class="page-header">
        <h1>上传作品</h1>
        <p>作品将添加到“{{ series.name }}”，提交后进入管理员审核。</p>
      </header>

      <form
        class="form-shell"
        action="{% url 'products:new_product' series.bango %}"
        method="POST"
        enctype="multipart/form-data"
      >
        {% csrf_token %}
        <div class="notice upload-notice">
          仅允许上传 EXE 或 ZIP 文件，单个文件大小不得超过 150 MB。文件需经过安全检查和管理员审核后才能下载。
        </div>
        {{ form.as_p }}
        <button class="button form-submit" type="submit">提交作品</button>
      </form>
    </div>
  </div>
{% endblock content %}
