{% extends 'website_index/base.html' %}

{% block page_title %}编辑作品集 - {{ series.name }}{% endblock page_title %}

{% block content %}
  <div class="page-shell">
    <div class="form-layout">
      <header class="page-header">
        <h1>编辑作品集</h1>
        <p>修改“{{ series.name }}”的基本信息。内容发生变化后将重新进入审核。</p>
      </header>

      <form
        class="form-shell"
        action="{% url 'products:edit_single_series' series.bango %}"
        method="POST"
      >
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button form-submit" type="submit">保存修改</button>
      </form>
    </div>
  </div>
{% endblock content %}
