{% extends 'website_index/base.html' %}

{% block page_title %}社员心声 - 南师附中开发者社团{% endblock page_title %}

{% block content %}
  <div class="page-shell">
    <header class="page-header">
      <h1>社员有话说</h1>
      <p>来自社团成员的编程感悟、成长故事与建议。</p>
    </header>

    <div class="quote-list">
      {% for comment in comments %}
        <article class="quote-card reveal">
          <blockquote>{{ comment.content|linebreaks }}</blockquote>
          <cite>{{ comment.creator }}</cite>
        </article>
      {% empty %}
        <div class="empty-state"><p>暂无评论</p></div>
      {% endfor %}
    </div>
  </div>
{% endblock content %}
