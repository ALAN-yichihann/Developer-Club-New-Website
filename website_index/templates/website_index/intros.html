{% extends 'website_index/base.html' %}

{% block content %}

<ul>
    {% for intro in intros %}
    <li>
        <p>
            {{ intro.title }}<br>
            {{ intro.content|linebreaks }}

    {% empty %}

    {% endfor %}
</ul>

{% endblock content %}
