{% extends 'website_index/base.html' %}

{% block content %}

<ul>
    {% for development in developments %}
    <li>
      <p>
        {{ development.title }}<br>
        {{ development.content|linebreaks }}
      </p>
    </li>
    {% empty %}
        <p>暂无大事记</p>
    {% endfor %}
</ul>

{% endblock content %}
